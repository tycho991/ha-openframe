name: validate
# Home Assistant's own check of the integration, and HACS's check of `hacs.json` and the folder structure, which
# the Marketplace of Home Assistant 2026.11 and later requires as well.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly: Home Assistant and HACS change their rules
permissions: {}
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No release since 2020; Home Assistant documents the branch, so the digest follows master.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks `hacs.json` and the folder structure, which both HACS and the Marketplace read; the Marketplace
      # documents no validator of its own.
      # The last release is from 2022; HACS documents the branch, so the digest follows main.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
