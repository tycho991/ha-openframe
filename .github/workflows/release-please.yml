name: release-please
# After every push to main, release-please keeps the release pull request up to date. Merging it (only when the owner
# says so) creates the tag vX.Y.Z and a published release; HACS offers it as an update. Releases are not drafts,
# because HACS ignores drafts.
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
